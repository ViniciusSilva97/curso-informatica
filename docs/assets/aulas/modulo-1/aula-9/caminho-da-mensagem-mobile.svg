<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1480" role="img">
  <title>Caminho simplificado de uma mensagem pela internet</title>
  <desc>Uma mensagem sai do celular do remetente, passa pelo roteador e pelo provedor, atravessa redes e roteadores da internet, chega ao servidor do serviço e depois percorre redes até o celular do destinatário.</desc>
  <rect width="600" height="1480" rx="24" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="300" y="43" text-anchor="middle" fill="#ffd21a" font-size="22" font-weight="800">O CAMINHO DE “BOM DIA”</text>
    <path d="M110 100v1200" stroke="#16c65b" stroke-width="8"/>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4"><rect x="60" y="75" width="490" height="170" rx="18"/><rect x="60" y="265" width="490" height="170" rx="18"/><rect x="60" y="455" width="490" height="170" rx="18"/><rect x="60" y="645" width="490" height="200" rx="18"/><rect x="60" y="865" width="490" height="170" rx="18"/><rect x="60" y="1055" width="490" height="170" rx="18"/><rect x="60" y="1245" width="490" height="170" rx="18"/></g>
    <g fill="#ffd21a"><circle cx="110" cy="160" r="36"/><circle cx="110" cy="350" r="36"/><circle cx="110" cy="540" r="36"/><circle cx="110" cy="745" r="36"/><circle cx="110" cy="950" r="36"/><circle cx="110" cy="1140" r="36"/><circle cx="110" cy="1330" r="36"/></g>
    <g fill="#07110c" text-anchor="middle" font-size="22" font-weight="800"><text x="110" y="168">1</text><text x="110" y="358">2</text><text x="110" y="548">3</text><text x="110" y="753">4</text><text x="110" y="958">5</text><text x="110" y="1148">6</text><text x="110" y="1338">7</text></g>
    <g fill="#fff" font-size="22" font-weight="800"><text x="170" y="135">SEU CELULAR</text><text x="170" y="325">ROTEADOR DA CASA</text><text x="170" y="515">PROVEDOR A</text><text x="170" y="720">SERVIDOR DO SERVIÇO</text><text x="170" y="925">PROVEDOR B</text><text x="170" y="1115">ROTEADOR DA CASA</text><text x="170" y="1305">CELULAR DO AMIGO</text></g>
    <g fill="#16c65b" font-size="17"><text x="170" y="175">envia “Bom dia”</text><text x="170" y="365">encaminha para fora da casa</text><text x="170" y="555">conecta à internet</text><text x="170" y="760">recebe e encaminha</text><text x="170" y="965">leva à rede do amigo</text><text x="170" y="1155">entrega dentro da casa</text><text x="170" y="1345">exibe a mensagem</text></g>
    <g fill="#aeb8b1" font-size="14"><text x="170" y="790">vários caminhos internos resumidos</text></g>
    <text x="300" y="1450" text-anchor="middle" fill="#ffd21a" font-size="16" font-weight="700">UM CAMINHO SIMPLIFICADO ENTRE MUITAS REDES</text>
  </g>
</svg>
