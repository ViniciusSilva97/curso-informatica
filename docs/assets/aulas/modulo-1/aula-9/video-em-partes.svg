<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img">
  <title>Vídeo enviado em partes para reprodução contínua</title>
  <desc>Um servidor envia sucessivas partes de um vídeo pela internet. O dispositivo recebe essas partes em uma pequena área de espera e reproduz o conteúdo na ordem correta enquanto outras partes continuam chegando.</desc>
  <rect width="1200" height="690" rx="28" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#ffd21a" font-size="30" font-weight="800">AO APERTAR PLAY, O VÍDEO CHEGA EM PARTES</text>
    <rect x="55" y="130" width="285" height="400" rx="22" fill="#101b14" stroke="#ffd21a" stroke-width="4"/><text x="197" y="180" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">SERVIDOR DE VÍDEO</text>
    <rect x="110" y="220" width="175" height="190" rx="14" fill="#ffd21a"/><rect x="132" y="245" width="131" height="130" rx="8" fill="#07110c"/><path d="M153 272h89M153 306h89M153 340h89" stroke="#16c65b" stroke-width="8"/><text x="197" y="463" text-anchor="middle" fill="#fff" font-size="16">armazena o conteúdo</text>
    <rect x="420" y="150" width="360" height="360" rx="100" fill="#101b14" stroke="#16c65b" stroke-width="5"/><text x="600" y="205" text-anchor="middle" fill="#ffd21a" font-size="22" font-weight="800">INTERNET</text>
    <g><rect x="465" y="265" width="55" height="55" rx="8" fill="#ffd21a"/><rect x="535" y="265" width="55" height="55" rx="8" fill="#16c65b"/><rect x="605" y="265" width="55" height="55" rx="8" fill="#ffd21a"/><rect x="675" y="265" width="55" height="55" rx="8" fill="#16c65b"/></g>
    <g text-anchor="middle" fill="#07110c" font-size="15" font-weight="800"><text x="492" y="299">1</text><text x="562" y="299">2</text><text x="632" y="299">3</text><text x="702" y="299">4</text></g>
    <path d="M340 330h80m-25-22 25 22-25 22M780 330h80m-25-22 25 22-25 22" fill="none" stroke="#16c65b" stroke-width="8"/>
    <text x="600" y="390" text-anchor="middle" fill="#fff" font-size="17">partes viajam e podem seguir rotas da rede</text>
    <rect x="860" y="130" width="285" height="400" rx="22" fill="#101b14" stroke="#16c65b" stroke-width="4"/><text x="1002" y="180" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">SEU DISPOSITIVO</text>
    <rect x="905" y="220" width="195" height="130" rx="14" fill="#fff"/><rect x="920" y="238" width="165" height="94" rx="6" fill="#07110c"/><path d="M980 260l50 25-50 25z" fill="#16c65b"/>
    <text x="1002" y="390" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">BUFFER</text><g><rect x="910" y="415" width="38" height="38" rx="6" fill="#ffd21a"/><rect x="958" y="415" width="38" height="38" rx="6" fill="#16c65b"/><rect x="1006" y="415" width="38" height="38" rx="6" fill="#ffd21a"/><rect x="1054" y="415" width="38" height="38" rx="6" fill="#29322c"/></g>
    <rect x="215" y="580" width="770" height="65" rx="20" fill="#ffd21a"/><text x="600" y="607" text-anchor="middle" fill="#07110c" font-size="21" font-weight="800">ENQUANTO UMA PARTE É EXIBIDA, OUTRAS CONTINUAM CHEGANDO</text><text x="600" y="632" text-anchor="middle" fill="#07110c" font-size="14">A pequena reserva ajuda a manter a reprodução contínua.</text>
  </g>
</svg>
