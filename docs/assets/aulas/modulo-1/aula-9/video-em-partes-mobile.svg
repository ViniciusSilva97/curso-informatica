<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1320" role="img">
  <title>Vídeo enviado em partes para reprodução contínua</title>
  <desc>Um servidor envia sucessivas partes de um vídeo pela internet. O dispositivo recebe essas partes em uma pequena área de espera e reproduz o conteúdo na ordem correta enquanto outras partes continuam chegando.</desc>
  <rect width="600" height="1320" rx="24" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="300" y="43" text-anchor="middle" fill="#ffd21a" font-size="21" font-weight="800">O VÍDEO CHEGA EM PARTES</text>
    <rect x="50" y="78" width="500" height="310" rx="20" fill="#101b14" stroke="#ffd21a" stroke-width="4"/><text x="300" y="128" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">1. SERVIDOR</text>
    <rect x="190" y="165" width="220" height="150" rx="14" fill="#ffd21a"/><rect x="217" y="190" width="166" height="100" rx="8" fill="#07110c"/><path d="M245 216h110M245 241h110M245 266h110" stroke="#16c65b" stroke-width="8"/><text x="300" y="353" text-anchor="middle" fill="#fff" font-size="16">guarda o conteúdo completo</text>
    <path d="M300 388v65m-19-19 19 21 19-21" fill="none" stroke="#16c65b" stroke-width="8"/>
    <rect x="50" y="453" width="500" height="330" rx="20" fill="#101b14" stroke="#16c65b" stroke-width="4"/><text x="300" y="505" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">2. PARTES PELA INTERNET</text>
    <g><rect x="105" y="570" width="75" height="75" rx="10" fill="#ffd21a"/><rect x="205" y="570" width="75" height="75" rx="10" fill="#16c65b"/><rect x="305" y="570" width="75" height="75" rx="10" fill="#ffd21a"/><rect x="405" y="570" width="75" height="75" rx="10" fill="#16c65b"/></g><g text-anchor="middle" fill="#07110c" font-size="19" font-weight="800"><text x="142" y="615">1</text><text x="242" y="615">2</text><text x="342" y="615">3</text><text x="442" y="615">4</text></g>
    <text x="300" y="705" text-anchor="middle" fill="#fff" font-size="17">as partes continuam chegando</text><text x="300" y="736" text-anchor="middle" fill="#aeb8b1" font-size="15">a rede pode usar vários equipamentos</text>
    <path d="M300 783v65m-19-19 19 21 19-21" fill="none" stroke="#ffd21a" stroke-width="8"/>
    <rect x="50" y="848" width="500" height="325" rx="20" fill="#101b14" stroke="#16c65b" stroke-width="4"/><text x="300" y="900" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">3. BUFFER E REPRODUÇÃO</text>
    <rect x="165" y="942" width="270" height="130" rx="14" fill="#fff"/><rect x="185" y="963" width="230" height="90" rx="6" fill="#07110c"/><path d="M275 982l60 26-60 26z" fill="#16c65b"/>
    <g><rect x="175" y="1090" width="50" height="35" rx="6" fill="#ffd21a"/><rect x="240" y="1090" width="50" height="35" rx="6" fill="#16c65b"/><rect x="305" y="1090" width="50" height="35" rx="6" fill="#ffd21a"/><rect x="370" y="1090" width="50" height="35" rx="6" fill="#29322c"/></g>
    <rect x="50" y="1210" width="500" height="70" rx="20" fill="#ffd21a"/><text x="300" y="1254" text-anchor="middle" fill="#07110c" font-size="17" font-weight="800">UMA PARTE TOCA ENQUANTO OUTRAS CHEGAM</text>
  </g>
</svg>
