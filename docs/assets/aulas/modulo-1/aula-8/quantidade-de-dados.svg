<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>Mais informações exigem mais bytes</title>
  <desc>Uma mensagem curta contém poucos dados, uma fotografia reúne muitos pixels e um vídeo 4K reúne muitos quadros com milhões de pixels, além de áudio, por isso seus arquivos tendem a ocupar espaços muito diferentes.</desc>
  <rect width="1200" height="680" rx="28" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">MAIS INFORMAÇÃO → MAIS BYTES</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4"><rect x="55" y="120" width="330" height="430" rx="22"/><rect x="435" y="120" width="330" height="430" rx="22"/><rect x="815" y="120" width="330" height="430" rx="22"/></g>
    <g text-anchor="middle"><g fill="#ffd21a" font-size="25" font-weight="800"><text x="220" y="177">MENSAGEM</text><text x="600" y="177">FOTOGRAFIA</text><text x="980" y="177">VÍDEO 4K</text></g>
      <rect x="135" y="220" width="170" height="105" rx="15" fill="#fff"/><path d="M160 250h120M160 275h90M160 300h105" stroke="#07110c" stroke-width="7"/>
      <rect x="505" y="215" width="190" height="125" rx="12" fill="#ffd21a"/><circle cx="550" cy="255" r="19" fill="#07110c"/><path d="M520 322l52-52 33 32 28-24 48 44" fill="#16c65b" stroke="#07110c" stroke-width="5"/>
      <rect x="875" y="215" width="210" height="125" rx="12" fill="#ffd21a"/><path d="M905 240h150v75H905z" fill="#07110c"/><text x="980" y="291" fill="#16c65b" font-size="34" font-weight="800">4K</text>
      <g fill="#fff" font-size="18"><text x="220" y="387">alguns caracteres</text><text x="600" y="387">milhões de pixels</text><text x="980" y="387">muitos quadros + áudio</text></g>
      <g fill="#16c65b"><rect x="120" y="430" width="200" height="26" rx="13"/><rect x="485" y="430" width="230" height="26" rx="13"/><rect x="850" y="430" width="260" height="26" rx="13"/></g>
      <g fill="#ffd21a"><rect x="120" y="430" width="35" height="26" rx="13"/><rect x="485" y="430" width="145" height="26" rx="13"/><rect x="850" y="430" width="260" height="26" rx="13"/></g>
      <g fill="#aeb8b1" font-size="15"><text x="220" y="493">poucos dados</text><text x="600" y="493">muitos dados</text><text x="980" y="493">enorme quantidade de dados</text></g></g>
    <rect x="220" y="590" width="760" height="58" rx="20" fill="#ffd21a"/><text x="600" y="627" text-anchor="middle" fill="#07110c" font-size="19" font-weight="800">TAMANHO DEPENDE DO CONTEÚDO, QUALIDADE E DURAÇÃO</text>
  </g>
</svg>
