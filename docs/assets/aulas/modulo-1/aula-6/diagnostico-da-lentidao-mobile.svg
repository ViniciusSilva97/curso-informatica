<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1390" role="img">
  <title>Sequência inicial para investigar um computador lento</title>
  <desc>Antes de trocar o computador, confira o espaço livre, observe a memória RAM, identifique se há SSD ou HD, revise os programas de inicialização e mantenha o sistema atualizado.</desc>
  <rect width="600" height="1390" rx="24" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="300" y="45" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">ANTES DE COMPRAR OUTRO</text>
    <text x="300" y="76" text-anchor="middle" fill="#fff" font-size="16">investigue do simples para o caro</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="50" y="110" width="500" height="185" rx="18"/><rect x="50" y="315" width="500" height="185" rx="18"/><rect x="50" y="520" width="500" height="185" rx="18"/><rect x="50" y="725" width="500" height="185" rx="18"/><rect x="50" y="930" width="500" height="185" rx="18"/>
    </g>
    <g>
      <g fill="#ffd21a"><circle cx="120" cy="202" r="35"/><circle cx="120" cy="407" r="35"/><circle cx="120" cy="612" r="35"/><circle cx="120" cy="817" r="35"/><circle cx="120" cy="1022" r="35"/></g>
      <g fill="#07110c" text-anchor="middle" font-size="25" font-weight="800"><text x="120" y="211">1</text><text x="120" y="416">2</text><text x="120" y="621">3</text><text x="120" y="826">4</text><text x="120" y="1031">5</text></g>
      <g fill="#fff" font-size="23" font-weight="800"><text x="180" y="171">ESPAÇO LIVRE</text><text x="180" y="376">MEMÓRIA RAM</text><text x="180" y="581">SSD OU HD</text><text x="180" y="786">INICIALIZAÇÃO</text><text x="180" y="991">ATUALIZAÇÕES</text></g>
      <g fill="#16c65b" font-size="17"><text x="180" y="207">o disco está cheio?</text><text x="180" y="412">ela chega ao limite?</text><text x="180" y="617">qual tecnologia usa?</text><text x="180" y="822">o que abre sozinho?</text><text x="180" y="1027">sistema e drivers</text></g>
      <g fill="#cbd3cd" font-size="16"><text x="180" y="243">libere espaço</text><text x="180" y="448">feche tarefas e compare</text><text x="180" y="653">SSD é mais ágil</text><text x="180" y="858">desative excessos</text><text x="180" y="1063">conclua instalações</text></g>
    </g>
    <path d="M300 1120v50m-18-18 18 20 18-20" fill="none" stroke="#16c65b" stroke-width="7"/>
    <rect x="50" y="1185" width="500" height="145" rx="22" fill="#ffd21a"/>
    <text x="300" y="1230" text-anchor="middle" fill="#07110c" font-size="22" font-weight="800">SÓ DEPOIS DECIDA</text><text x="300" y="1263" text-anchor="middle" fill="#07110c" font-size="22" font-weight="800">QUAL UPGRADE FAZER</text><text x="300" y="1300" text-anchor="middle" fill="#07110c" font-size="16">RAM, SSD ou outro componente</text>
    <text x="300" y="1365" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">DIAGNOSTICAR EVITA GASTOS</text>
  </g>
</svg>
