<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>O que acontece quando a memória RAM enche</title>
  <desc>Programas ocupam a memória RAM. Quando ela fica cheia, o sistema usa o SSD ou HD como memória de apoio, que é mais lenta, e o usuário percebe demora e travamentos.</desc>
  <rect width="1200" height="650" rx="28" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">QUANDO A MEMÓRIA RAM ENCHE</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="55" y="135" width="260" height="340" rx="22"/><rect x="470" y="135" width="260" height="340" rx="22"/><rect x="885" y="135" width="260" height="340" rx="22"/>
    </g>
    <g text-anchor="middle">
      <text x="185" y="185" fill="#fff" font-size="23" font-weight="800">1. PROGRAMAS</text>
      <rect x="100" y="225" width="170" height="42" rx="8" fill="#16c65b"/><rect x="100" y="280" width="170" height="42" rx="8" fill="#16c65b"/><rect x="100" y="335" width="170" height="42" rx="8" fill="#ffd21a"/>
      <text x="185" y="252" fill="#07110c" font-size="16" font-weight="700">NAVEGADOR</text><text x="185" y="307" fill="#07110c" font-size="16" font-weight="700">EDITOR</text><text x="185" y="362" fill="#07110c" font-size="16" font-weight="700">JOGO</text>
      <text x="185" y="425" fill="#16c65b" font-size="17">cada tarefa ocupa espaço</text>
      <text x="600" y="185" fill="#fff" font-size="23" font-weight="800">2. RAM LOTADA</text>
      <rect x="520" y="225" width="160" height="145" rx="12" fill="none" stroke="#ffd21a" stroke-width="8"/>
      <rect x="535" y="240" width="130" height="32" fill="#16c65b"/><rect x="535" y="280" width="130" height="32" fill="#16c65b"/><rect x="535" y="320" width="130" height="32" fill="#ffd21a"/>
      <text x="600" y="414" fill="#ffd21a" font-size="20" font-weight="800">100% EM USO</text>
      <text x="1015" y="185" fill="#fff" font-size="23" font-weight="800">3. MEMÓRIA DE APOIO</text>
      <rect x="945" y="232" width="140" height="105" rx="12" fill="#ffd21a"/><circle cx="1015" cy="284" r="32" fill="none" stroke="#07110c" stroke-width="8"/><circle cx="1015" cy="284" r="7" fill="#07110c"/>
      <text x="1015" y="383" fill="#fff" font-size="20" font-weight="800">SSD OU HD</text><text x="1015" y="420" fill="#16c65b" font-size="17">funciona, mas é mais lento</text>
    </g>
    <g fill="none" stroke="#ffd21a" stroke-width="8"><path d="M315 305h135m-28-25 28 25-28 25"/><path d="M730 305h135m-28-25 28 25-28 25"/></g>
    <rect x="220" y="520" width="760" height="78" rx="20" fill="#ffd21a"/>
    <text x="600" y="570" text-anchor="middle" fill="#07110c" font-family="Arial,sans-serif" font-size="24" font-weight="800">RESULTADO: DEMORA, ENGASGOS E TRAVAMENTOS</text>
  </g>
</svg>
