<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1260" role="img">
  <title>Comparação entre um computador equilibrado e outro desequilibrado</title>
  <desc>O computador A tem CPU intermediária, 16 GB de RAM, SSD e sistema organizado. O computador B tem CPU potente, 4 GB de RAM, HD antigo e muitos programas na inicialização.</desc>
  <rect width="600" height="1260" rx="24" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="300" y="45" text-anchor="middle" fill="#ffd21a" font-size="23" font-weight="800">QUAL PARECE MAIS RÁPIDO?</text>
    <rect x="45" y="78" width="510" height="500" rx="22" fill="#101b14" stroke="#16c65b" stroke-width="5"/>
    <text x="300" y="129" text-anchor="middle" fill="#16c65b" font-size="28" font-weight="800">COMPUTADOR A</text>
    <g font-size="20">
      <text x="90" y="190" fill="#fff" font-weight="800">CPU INTERMEDIÁRIA</text><text x="90" y="222" fill="#16c65b">adequada às tarefas</text>
      <text x="90" y="287" fill="#fff" font-weight="800">16 GB DE RAM</text><text x="90" y="319" fill="#16c65b">espaço para várias tarefas</text>
      <text x="90" y="384" fill="#fff" font-weight="800">SSD</text><text x="90" y="416" fill="#16c65b">entrega arquivos rapidamente</text>
      <text x="90" y="481" fill="#fff" font-weight="800">SISTEMA ORGANIZADO</text><text x="90" y="513" fill="#16c65b">menos carga desnecessária</text>
    </g>
    <rect x="45" y="612" width="510" height="500" rx="22" fill="#101b14" stroke="#5d685f" stroke-width="5"/>
    <text x="300" y="663" text-anchor="middle" fill="#ffd21a" font-size="28" font-weight="800">COMPUTADOR B</text>
    <g font-size="20">
      <text x="90" y="724" fill="#fff" font-weight="800">CPU MUITO POTENTE</text><text x="90" y="756" fill="#9ba49d">sozinha não resolve tudo</text>
      <text x="90" y="821" fill="#fff" font-weight="800">4 GB DE RAM</text><text x="90" y="853" fill="#ffd21a">pouco espaço de trabalho</text>
      <text x="90" y="918" fill="#fff" font-weight="800">HD ANTIGO</text><text x="90" y="950" fill="#ffd21a">entrega dados lentamente</text>
      <text x="90" y="1015" fill="#fff" font-weight="800">INICIALIZAÇÃO CHEIA</text><text x="90" y="1047" fill="#ffd21a">programas disputam recursos</text>
    </g>
    <rect x="45" y="1150" width="510" height="72" rx="20" fill="#ffd21a"/>
    <text x="300" y="1179" text-anchor="middle" fill="#07110c" font-size="19" font-weight="800">EQUILÍBRIO COSTUMA VENCER</text><text x="300" y="1206" text-anchor="middle" fill="#07110c" font-size="17">uma única peça potente</text>
  </g>
</svg>
