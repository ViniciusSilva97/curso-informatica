<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>O desempenho depende do equilíbrio entre os componentes</title>
  <desc>CPU, memória RAM, armazenamento e sistema operacional trabalham em conjunto. Um único componente no limite pode reduzir o desempenho de todo o computador.</desc>
  <rect width="1200" height="650" rx="28" fill="#07110c"/>
  <path d="M30 105V30h75M1095 30h75v75M30 545v75h75M1095 620h75v-75" fill="none" stroke="#16c65b" stroke-width="8"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="65" text-anchor="middle" fill="#ffd21a" font-size="32" font-weight="800">DESEMPENHO É TRABALHO EM EQUIPE</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="55" y="125" width="245" height="225" rx="20"/>
      <rect x="335" y="125" width="245" height="225" rx="20"/>
      <rect x="620" y="125" width="245" height="225" rx="20"/>
      <rect x="900" y="125" width="245" height="225" rx="20"/>
    </g>
    <g text-anchor="middle">
      <circle cx="177" cy="195" r="41" fill="#ffd21a"/><text x="177" y="207" fill="#07110c" font-size="27" font-weight="800">CPU</text>
      <text x="177" y="273" fill="#fff" font-size="22" font-weight="800">PROCESSA</text><text x="177" y="309" fill="#16c65b" font-size="16">cálculos e instruções</text>
      <rect x="396" y="157" width="122" height="77" rx="9" fill="#ffd21a"/><path d="M415 170v51m22-51v51m22-51v51m22-51v51" stroke="#07110c" stroke-width="7"/>
      <text x="457" y="273" fill="#fff" font-size="22" font-weight="800">RAM</text><text x="457" y="309" fill="#16c65b" font-size="16">mantém tarefas abertas</text>
      <rect x="688" y="157" width="110" height="77" rx="12" fill="#ffd21a"/><circle cx="743" cy="195" r="24" fill="none" stroke="#07110c" stroke-width="7"/><circle cx="743" cy="195" r="5" fill="#07110c"/>
      <text x="742" y="273" fill="#fff" font-size="22" font-weight="800">SSD OU HD</text><text x="742" y="309" fill="#16c65b" font-size="16">entrega os arquivos</text>
      <rect x="971" y="152" width="104" height="86" rx="8" fill="#ffd21a"/><path d="M984 170h78M984 188h49M984 206h64" stroke="#07110c" stroke-width="7"/>
      <text x="1022" y="273" fill="#fff" font-size="22" font-weight="800">SISTEMA</text><text x="1022" y="309" fill="#16c65b" font-size="16">organiza os recursos</text>
    </g>
    <path d="M177 350v55M457 350v55M742 350v55M1022 350v55" stroke="#ffd21a" stroke-width="7"/>
    <rect x="155" y="405" width="890" height="145" rx="25" fill="#ffd21a"/>
    <text x="600" y="458" text-anchor="middle" fill="#07110c" font-size="27" font-weight="800">SE UM FICA NO LIMITE, TODOS ESPERAM</text>
    <text x="600" y="502" text-anchor="middle" fill="#07110c" font-size="20">O componente mais lento pode virar o gargalo da tarefa.</text>
    <text x="600" y="586" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">NÃO CULPE APENAS O PROCESSADOR</text>
  </g>
</svg>
