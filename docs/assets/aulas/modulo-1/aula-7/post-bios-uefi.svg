<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img">
  <title>Verificação inicial feita pela BIOS ou UEFI</title>
  <desc>A BIOS ou UEFI, armazenada em um chip da placa-mãe, verifica processador, memória RAM, vídeo e armazenamento antes de procurar um sistema inicializável.</desc>
  <rect width="1200" height="670" rx="28" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="62" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">BIOS / UEFI: TESTE ANTES DO SISTEMA</text>
    <rect x="430" y="125" width="340" height="170" rx="24" fill="#ffd21a"/>
    <rect x="520" y="162" width="160" height="95" rx="10" fill="#07110c"/><path d="M540 180h120M540 202h80M540 224h100" stroke="#16c65b" stroke-width="7"/>
    <text x="600" y="281" text-anchor="middle" fill="#07110c" font-size="17" font-weight="800">FIRMWARE DA PLACA-MÃE</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4"><rect x="45" y="365" width="250" height="190" rx="20"/><rect x="330" y="365" width="250" height="190" rx="20"/><rect x="620" y="365" width="250" height="190" rx="20"/><rect x="905" y="365" width="250" height="190" rx="20"/></g>
    <g text-anchor="middle"><g fill="#ffd21a" font-size="26" font-weight="800"><text x="170" y="425">CPU</text><text x="455" y="425">RAM</text><text x="745" y="425">VÍDEO</text><text x="1030" y="425">DISCO</text></g>
      <g fill="#fff" font-size="18" font-weight="700"><text x="170" y="472">foi detectada?</text><text x="455" y="472">está disponível?</text><text x="745" y="472">há saída de imagem?</text><text x="1030" y="472">há dispositivo?</text></g>
      <g fill="#16c65b" font-size="16"><text x="170" y="516">VERIFICAR</text><text x="455" y="516">VERIFICAR</text><text x="745" y="516">VERIFICAR</text><text x="1030" y="516">VERIFICAR</text></g></g>
    <g fill="none" stroke="#ffd21a" stroke-width="7"><path d="M530 295 170 365"/><path d="M575 295 455 365"/><path d="M625 295 745 365"/><path d="M670 295 1030 365"/></g>
    <text x="600" y="624" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">FALHA ESSENCIAL: BIPE, MENSAGEM DE ERRO OU AUSÊNCIA DE INICIALIZAÇÃO</text>
  </g>
</svg>
