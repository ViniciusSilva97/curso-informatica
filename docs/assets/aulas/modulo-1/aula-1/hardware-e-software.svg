<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hardware e software trabalham juntos</title>
  <desc id="desc">Hardware é a parte física que pode ser tocada; software são programas e instruções. Um depende do outro para o computador funcionar.</desc>
  <defs><style>.pixel{font-family:"Courier New",monospace;font-weight:700}.body{font-family:Arial,sans-serif}</style></defs>
  <rect width="1200" height="620" rx="22" fill="#fff8eb"/>
  <rect x="18" y="18" width="1164" height="584" rx="14" fill="none" stroke="#050806" stroke-width="5"/>
  <text x="600" y="70" fill="#050806" font-size="32" text-anchor="middle" class="pixel">HARDWARE + SOFTWARE</text>
  <g>
    <rect x="65" y="115" width="485" height="390" rx="12" fill="#050806" stroke="#009c3b" stroke-width="5"/>
    <text x="307" y="166" fill="#19c65b" font-size="31" text-anchor="middle" class="pixel">HARDWARE</text>
    <text x="307" y="201" fill="#fff" font-size="20" text-anchor="middle" class="body">A parte física: você pode tocar</text>
    <rect x="150" y="245" width="315" height="165" rx="8" fill="#111a14" stroke="#19c65b" stroke-width="4"/>
    <rect x="190" y="278" width="110" height="85" fill="#ffc900"/><rect x="330" y="270" width="90" height="100" fill="#17231a" stroke="#19c65b" stroke-width="5"/>
    <path d="M205 263v15m25-15v15m25-15v15m25-15v15m-75 85v15m25-15v15m25-15v15m25-15v15" stroke="#009c3b" stroke-width="8"/>
    <text x="307" y="453" fill="#bfc9c1" font-size="19" text-anchor="middle" class="body">CPU · RAM · SSD · monitor · teclado</text>
  </g>
  <g>
    <rect x="650" y="115" width="485" height="390" rx="12" fill="#ffc900" stroke="#050806" stroke-width="5"/>
    <text x="892" y="166" fill="#050806" font-size="31" text-anchor="middle" class="pixel">SOFTWARE</text>
    <text x="892" y="201" fill="#050806" font-size="20" text-anchor="middle" class="body">Programas e instruções: você utiliza</text>
    <rect x="735" y="245" width="315" height="165" rx="8" fill="#050806" stroke="#009c3b" stroke-width="4"/>
    <rect x="765" y="275" width="55" height="55" fill="#009c3b"/><rect x="840" y="275" width="55" height="55" fill="#ffc900"/>
    <rect x="915" y="275" width="105" height="18" fill="#19c65b"/><rect x="915" y="312" width="82" height="18" fill="#fff"/>
    <rect x="765" y="350" width="255" height="22" fill="#223126"/>
    <text x="892" y="453" fill="#050806" font-size="19" text-anchor="middle" class="body">Windows · Linux · apps · jogos</text>
  </g>
  <path d="M550 310h100" stroke="#009c3b" stroke-width="9"/>
  <path d="M600 275l35 35-35 35-35-35z" fill="#009c3b"/>
  <rect x="270" y="535" width="660" height="48" fill="#009c3b"/>
  <text x="600" y="567" fill="#fff" font-size="21" text-anchor="middle" class="pixel">UM PRECISA DO OUTRO PARA FUNCIONAR</text>
</svg>
