<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 920" role="img" aria-labelledby="title desc">
  <title id="title">Origem da palavra informática</title>
  <desc id="desc">Informação somada a automática forma informática.</desc>
  <defs><style>.pixel{font-family:"Courier New",monospace;font-weight:700}.body{font-family:Arial,sans-serif}</style></defs>
  <rect width="600" height="920" rx="22" fill="#fff8eb"/>
  <rect x="16" y="16" width="568" height="888" rx="14" fill="none" stroke="#050806" stroke-width="5"/>
  <text x="300" y="65" fill="#050806" font-size="27" text-anchor="middle" class="pixel">DE ONDE VEM</text>
  <text x="300" y="100" fill="#050806" font-size="27" text-anchor="middle" class="pixel">“INFORMÁTICA”?</text>
  <rect x="65" y="145" width="470" height="160" rx="10" fill="#050806" stroke="#009c3b" stroke-width="5"/>
  <text x="300" y="210" fill="#19c65b" font-size="30" text-anchor="middle" class="pixel">INFORMAÇÃO</text>
  <text x="300" y="255" fill="#fff" font-size="19" text-anchor="middle" class="body">Foto · mensagem · vídeo · documento</text>
  <text x="300" y="358" fill="#009c3b" font-size="54" text-anchor="middle" class="pixel">+</text>
  <rect x="65" y="395" width="470" height="160" rx="10" fill="#050806" stroke="#ffc900" stroke-width="5"/>
  <text x="300" y="460" fill="#ffc900" font-size="30" text-anchor="middle" class="pixel">AUTOMÁTICA</text>
  <text x="300" y="505" fill="#fff" font-size="19" text-anchor="middle" class="body">Armazenar · processar · transmitir</text>
  <text x="300" y="615" fill="#009c3b" font-size="54" text-anchor="middle" class="pixel">=</text>
  <rect x="110" y="650" width="380" height="100" rx="10" fill="#ffc900" stroke="#050806" stroke-width="5"/>
  <text x="300" y="713" fill="#050806" font-size="31" text-anchor="middle" class="pixel">INFORMÁTICA</text>
  <rect x="60" y="800" width="480" height="70" rx="8" fill="#e8f8ee" stroke="#009c3b" stroke-width="3"/>
  <text x="300" y="828" fill="#050806" font-size="17" text-anchor="middle" class="body">Em linguagem simples:</text>
  <text x="300" y="853" fill="#050806" font-size="17" text-anchor="middle" class="pixel">MÁQUINAS + INFORMAÇÕES</text>
</svg>
