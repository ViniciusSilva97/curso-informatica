    <rect x="540" y="238" width="120" height="120" fill="#050806"/>
    <path d="M520 258h20m-20 40h20m-20 40h20m120-80h20m-20 40h20m-20 40h20M560 218v20m40-20v20m40-20v20m-80 120v20m40-20v20m40-20v20" stroke="#009c3b" stroke-width="12"/>
