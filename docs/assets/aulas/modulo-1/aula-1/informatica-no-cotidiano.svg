    <text x="935" y="178">Vídeos</text><text x="935" y="210" fill="#bfc9c1">TikTok e YouTube</text>
    <text x="160" y="418">Pesquisas</text><text x="160" y="450" fill="#bfc9c1">Google e navegadores</text>
    <text x="940" y="418">Pagamentos</text><text x="940" y="450" fill="#bfc9c1">Pix e bancos</text>
    <text x="555" y="523">Música</text><text x="555" y="553" fill="#bfc9c1">Áudio digital</text>
