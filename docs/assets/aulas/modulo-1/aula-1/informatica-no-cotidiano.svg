<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A informática está presente no cotidiano</title>
  <desc id="desc">Celular, mensagens, vídeos, pesquisas, músicas e pagamentos se conectam ao processamento de informações.</desc>
  <defs>
    <style>
      .pixel{font-family:"Courier New",monospace;font-weight:700}.label{font-family:Arial,sans-serif}
      .line{stroke:#19c65b;stroke-width:6;stroke-dasharray:12 12}.card{fill:#101712;stroke:#19c65b;stroke-width:4}
    </style>
  </defs>
  <rect width="1200" height="620" rx="22" fill="#050806"/>
  <path d="M0 0h86v22H44v22H22v44H0zM1200 620h-86v-22h42v-22h22v-44h22z" fill="#ffc900"/>
  <text x="600" y="66" fill="#fff" font-size="34" text-anchor="middle" class="pixel">INFORMÁTICA NO DIA A DIA</text>
  <text x="600" y="102" fill="#bfc9c1" font-size="21" text-anchor="middle" class="label">A tecnologia trabalha com informações mesmo quando você não percebe.</text>
