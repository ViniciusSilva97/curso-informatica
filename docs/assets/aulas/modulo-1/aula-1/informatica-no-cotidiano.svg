  </g>
  <g class="card">
    <rect x="95" y="125" width="270" height="120" rx="10"/><rect x="835" y="125" width="270" height="120" rx="10"/>
    <rect x="55" y="365" width="310" height="120" rx="10"/><rect x="835" y="365" width="310" height="120" rx="10"/>
    <rect x="455" y="475" width="290" height="105" rx="10"/>
  </g>
  <g fill="#ffc900" font-size="38" text-anchor="middle" class="pixel">
