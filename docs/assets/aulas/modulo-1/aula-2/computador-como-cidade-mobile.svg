<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1120" role="img" aria-labelledby="title desc">
  <title id="title">O computador como uma cidade</title>
  <desc id="desc">CPU é o prefeito, RAM é a mesa, SSD é o depósito e placa-mãe são as ruas.</desc>
  <defs><style>.p{font-family:"Courier New",monospace;font-weight:700}.b{font-family:Arial,sans-serif}.c{fill:#101712;stroke:#19c65b;stroke-width:4}</style></defs>
  <rect width="600" height="1120" rx="22" fill="#050806"/>
  <text x="300" y="58" fill="#fff" font-size="27" text-anchor="middle" class="p">O COMPUTADOR</text><text x="300" y="92" fill="#fff" font-size="27" text-anchor="middle" class="p">COMO UMA CIDADE</text>
  <text x="300" y="126" fill="#bdc7c0" font-size="17" text-anchor="middle" class="b">Quatro funções, uma única equipe.</text>
  <g fill="none" stroke="#ffc900" stroke-width="7"><path d="M300 255V310M300 475V530M300 695V750M300 915V970"/></g>
  <g class="c"><rect x="70" y="155" width="460" height="100" rx="10"/><rect x="70" y="375" width="460" height="100" rx="10"/><rect x="70" y="595" width="460" height="100" rx="10"/><rect x="70" y="815" width="460" height="100" rx="10"/></g>
  <g fill="#ffc900" font-size="25" class="p"><text x="105" y="200">CPU</text><text x="105" y="420">RAM</text><text x="105" y="640">SSD</text><text x="105" y="860">PLACA-MÃE</text></g>
  <g fill="#fff" font-size="19" class="b"><text x="260" y="193">Prefeito: decide e executa</text><text x="260" y="413">Mesa: mantém o trabalho atual</text><text x="260" y="633">Depósito: guarda os dados</text><text x="260" y="853">Ruas: conectam tudo</text></g>
  <g fill="#bdc7c0" font-size="16" class="b"><text x="260" y="221">Processa instruções</text><text x="260" y="441">Armazenamento temporário</text><text x="260" y="661">Armazenamento permanente</text><text x="260" y="881">Permite a comunicação</text></g>
  <rect x="170" y="970" width="260" height="105" rx="12" fill="#ffc900" stroke="#fff" stroke-width="5"/><text x="300" y="1018" fill="#050806" font-size="21" text-anchor="middle" class="p">TRABALHO</text><text x="300" y="1048" fill="#009c3b" font-size="21" text-anchor="middle" class="p">EM EQUIPE</text>
</svg>
