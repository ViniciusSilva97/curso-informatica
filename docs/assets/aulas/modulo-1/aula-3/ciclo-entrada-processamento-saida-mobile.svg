<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1110" role="img">
  <title>Jornada de uma mensagem no computador</title>
  <desc>Uma mensagem digitada entra pelo teclado, é processada pela CPU e pelo sistema e aparece na tela como saída.</desc>
  <rect width="600" height="1110" rx="24" fill="#07110c"/>
  <text x="300" y="52" text-anchor="middle" fill="#ffd21a" font-family="Arial,sans-serif" font-size="25" font-weight="800">A JORNADA DA INFORMAÇÃO</text>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="85" width="490" height="270" rx="17" fill="#101b14" stroke="#16c65b" stroke-width="4"/>
    <rect x="170" y="126" width="260" height="92" rx="11" fill="#050806" stroke="#16c65b" stroke-width="5"/>
    <g fill="#253229"><rect x="195" y="150" width="55" height="25" rx="4"/><rect x="260" y="150" width="55" height="25" rx="4"/><rect x="325" y="150" width="55" height="25" rx="4"/><rect x="218" y="184" width="164" height="20" rx="4"/></g>
    <text x="300" y="262" text-anchor="middle" fill="#16c65b" font-size="24" font-weight="800">ENTRADA</text><text x="300" y="294" text-anchor="middle" fill="#fff" font-size="17">você digita a mensagem</text><text x="300" y="330" text-anchor="middle" fill="#ffd21a" font-size="25" font-weight="800">“Olá!”</text>
    <path d="M300 365v49m-18-18 18 20 18-20" fill="none" stroke="#ffd21a" stroke-width="7"/>
    <rect x="55" y="429" width="490" height="270" rx="17" fill="#101b14" stroke="#ffd21a" stroke-width="4"/>
    <rect x="241" y="474" width="118" height="118" rx="12" fill="#07110c" stroke="#ffd21a" stroke-width="7"/>
    <g stroke="#16c65b" stroke-width="5"><path d="M265 461v-20m35 20v-20m35 20v-20M265 605v20m35-20v20m35-20v20M228 499h-20m20 34h-20m20 34h-20M372 499h20m-20 34h20m-20 34h20"/></g>
    <text x="300" y="526" text-anchor="middle" fill="#ffd21a" font-size="20" font-weight="800">CPU</text><text x="300" y="556" text-anchor="middle" fill="#16c65b" font-size="15">+ SISTEMA</text>
    <text x="300" y="654" text-anchor="middle" fill="#ffd21a" font-size="24" font-weight="800">PROCESSAMENTO</text><text x="300" y="682" text-anchor="middle" fill="#fff" font-size="16">os dados são interpretados</text>
    <path d="M300 709v49m-18-18 18 20 18-20" fill="none" stroke="#ffd21a" stroke-width="7"/>
    <rect x="55" y="773" width="490" height="270" rx="17" fill="#101b14" stroke="#16c65b" stroke-width="4"/>
    <rect x="177" y="814" width="246" height="132" rx="9" fill="#050806" stroke="#16c65b" stroke-width="6"/><rect x="198" y="835" width="204" height="90" fill="#0d2719"/>
    <text x="300" y="892" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">Olá!</text>
    <text x="300" y="985" text-anchor="middle" fill="#16c65b" font-size="24" font-weight="800">SAÍDA</text><text x="300" y="1017" text-anchor="middle" fill="#fff" font-size="17">a mensagem aparece na tela</text>
    <rect x="62" y="1060" width="476" height="34" rx="17" fill="#ffd21a"/><text x="300" y="1083" text-anchor="middle" fill="#07110c" font-size="15" font-weight="800">ENTRADA → PROCESSAMENTO → SAÍDA</text>
  </g>
</svg>
