  <text x="300" y="96" fill="#fff" font-size="28" text-anchor="middle" class="pixel">NO DIA A DIA</text>
  <text x="300" y="132" fill="#bfc9c1" font-size="18" text-anchor="middle" class="body">A tecnologia trabalha sem você perceber.</text>
