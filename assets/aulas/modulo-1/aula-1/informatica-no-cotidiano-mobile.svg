  <defs><style>.pixel{font-family:"Courier New",monospace;font-weight:700}.body{font-family:Arial,sans-serif}.card{fill:#101712;stroke:#19c65b;stroke-width:4}</style></defs>
  <rect width="600" height="1040" rx="22" fill="#050806"/>
