<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Origem da palavra informática</title>
  <desc id="desc">Informação somada a automática forma informática: máquinas trabalhando com informações.</desc>
  <defs><style>.pixel{font-family:"Courier New",monospace;font-weight:700}.body{font-family:Arial,sans-serif}</style></defs>
  <rect width="1200" height="460" rx="22" fill="#fff8eb"/>
  <rect x="18" y="18" width="1164" height="424" rx="14" fill="none" stroke="#050806" stroke-width="5"/>
  <text x="600" y="72" fill="#050806" font-size="31" text-anchor="middle" class="pixel">DE ONDE VEM “INFORMÁTICA”?</text>
  <g>
    <rect x="75" y="125" width="360" height="160" rx="10" fill="#050806" stroke="#009c3b" stroke-width="5"/>
    <text x="255" y="190" fill="#19c65b" font-size="32" text-anchor="middle" class="pixel">INFORMAÇÃO</text>
    <text x="255" y="234" fill="#fff" font-size="20" text-anchor="middle" class="body">Foto · mensagem · vídeo · documento</text>
    <text x="490" y="225" fill="#009c3b" font-size="58" text-anchor="middle" class="pixel">+</text>
    <rect x="545" y="125" width="360" height="160" rx="10" fill="#050806" stroke="#ffc900" stroke-width="5"/>
    <text x="725" y="190" fill="#ffc900" font-size="32" text-anchor="middle" class="pixel">AUTOMÁTICA</text>
    <text x="725" y="234" fill="#fff" font-size="20" text-anchor="middle" class="body">Armazenar · processar · transmitir</text>
    <text x="960" y="225" fill="#009c3b" font-size="58" text-anchor="middle" class="pixel">=</text>
    <rect x="1010" y="125" width="130" height="160" rx="10" fill="#ffc900" stroke="#050806" stroke-width="5"/>
    <text x="1075" y="197" fill="#050806" font-size="20" text-anchor="middle" class="pixel">INFOR</text>
    <text x="1075" y="228" fill="#009c3b" font-size="20" text-anchor="middle" class="pixel">MÁTICA</text>
  </g>
  <path d="M130 344h940" stroke="#009c3b" stroke-width="5"/>
  <rect x="172" y="318" width="856" height="90" rx="8" fill="#e8f8ee" stroke="#009c3b" stroke-width="3"/>
  <text x="600" y="354" fill="#050806" font-size="19" text-anchor="middle" class="body">Em linguagem simples:</text>
  <text x="600" y="386" fill="#050806" font-size="23" text-anchor="middle" class="pixel">MÁQUINAS TRABALHANDO COM INFORMAÇÕES</text>
</svg>
