<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>Um bit representa um entre dois estados</title>
  <desc>Um interruptor desligado é associado ao valor zero e um interruptor ligado ao valor um. Cada escolha entre esses dois valores corresponde a um bit.</desc>
  <rect width="1200" height="650" rx="28" fill="#07110c"/>
  <path d="M30 105V30h75M1095 30h75v75M30 545v75h75M1095 620h75v-75" fill="none" stroke="#16c65b" stroke-width="8"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="66" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">UM BIT: UMA ESCOLHA ENTRE DOIS ESTADOS</text>
    <g fill="#101b14" stroke-width="5"><rect x="80" y="125" width="460" height="355" rx="24" stroke="#657069"/><rect x="660" y="125" width="460" height="355" rx="24" stroke="#16c65b"/></g>
    <g text-anchor="middle">
      <text x="310" y="185" fill="#fff" font-size="25" font-weight="800">DESLIGADO</text><text x="890" y="185" fill="#fff" font-size="25" font-weight="800">LIGADO</text>
      <rect x="185" y="225" width="250" height="105" rx="52" fill="#29322c"/><circle cx="242" cy="277" r="43" fill="#7b857e"/>
      <rect x="765" y="225" width="250" height="105" rx="52" fill="#0b7432"/><circle cx="958" cy="277" r="43" fill="#29d463"/>
      <text x="310" y="420" fill="#ffd21a" font-size="72" font-weight="800">0</text><text x="890" y="420" fill="#ffd21a" font-size="72" font-weight="800">1</text>
      <text x="310" y="455" fill="#aeb8b1" font-size="17">primeiro valor possível</text><text x="890" y="455" fill="#16c65b" font-size="17">segundo valor possível</text>
    </g>
    <path d="M540 303h120" stroke="#ffd21a" stroke-width="8" stroke-dasharray="12 12"/>
    <rect x="260" y="520" width="680" height="78" rx="20" fill="#ffd21a"/>
    <text x="600" y="552" text-anchor="middle" fill="#07110c" font-size="23" font-weight="800">0 OU 1 = 1 DÍGITO BINÁRIO</text><text x="600" y="580" text-anchor="middle" fill="#07110c" font-size="17">Binary Digit → Bit</text>
  </g>
</svg>
