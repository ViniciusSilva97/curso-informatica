<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>Oito bits formam um byte</title>
  <desc>Oito posições binárias, cada uma contendo zero ou um, são agrupadas para formar um byte.</desc>
  <rect width="1200" height="650" rx="28" fill="#07110c"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="66" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">8 BITS TRABALHANDO COMO UM GRUPO</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="65" y="155" width="115" height="180" rx="16"/><rect x="200" y="155" width="115" height="180" rx="16"/><rect x="335" y="155" width="115" height="180" rx="16"/><rect x="470" y="155" width="115" height="180" rx="16"/>
      <rect x="615" y="155" width="115" height="180" rx="16"/><rect x="750" y="155" width="115" height="180" rx="16"/><rect x="885" y="155" width="115" height="180" rx="16"/><rect x="1020" y="155" width="115" height="180" rx="16"/>
    </g>
    <g text-anchor="middle" font-weight="800"><g fill="#ffd21a" font-size="60"><text x="122" y="260">0</text><text x="257" y="260">1</text><text x="392" y="260">0</text><text x="527" y="260">0</text><text x="672" y="260">0</text><text x="807" y="260">0</text><text x="942" y="260">0</text><text x="1077" y="260">1</text></g>
      <g fill="#16c65b" font-size="15"><text x="122" y="307">BIT 1</text><text x="257" y="307">BIT 2</text><text x="392" y="307">BIT 3</text><text x="527" y="307">BIT 4</text><text x="672" y="307">BIT 5</text><text x="807" y="307">BIT 6</text><text x="942" y="307">BIT 7</text><text x="1077" y="307">BIT 8</text></g></g>
    <path d="M122 350v60h955v-60M600 410v45" fill="none" stroke="#ffd21a" stroke-width="8"/>
    <rect x="350" y="455" width="500" height="115" rx="24" fill="#ffd21a"/>
    <text x="600" y="504" text-anchor="middle" fill="#07110c" font-size="31" font-weight="800">1 BYTE</text><text x="600" y="544" text-anchor="middle" fill="#07110c" font-size="18">uma unidade básica de armazenamento</text>
    <text x="600" y="620" text-anchor="middle" fill="#fff" font-size="18">Cada posição continua valendo apenas 0 ou 1.</text>
  </g>
</svg>
