<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" role="img">
  <title>Android e iOS comparados sem disputa</title>
  <desc>Android aparece em aparelhos de vários fabricantes e formatos, enquanto iOS funciona nos smartphones Apple com forte integração entre hardware e software.</desc>
  <rect width="600" height="1050" rx="24" fill="#07110c"/>
  <text x="300" y="48" text-anchor="middle" fill="#ffd21a" font-family="Arial,sans-serif" font-size="22" font-weight="800">DOIS CAMINHOS PARA O MUNDO MÓVEL</text>
  <g font-family="Arial,sans-serif">
    <rect x="45" y="80" width="510" height="430" rx="19" fill="#101b14" stroke="#16c65b" stroke-width="4"/>
    <text x="300" y="130" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">ANDROID</text><text x="300" y="170" text-anchor="middle" fill="#16c65b" font-size="19" font-weight="800">DIVERSIDADE</text>
    <rect x="240" y="196" width="120" height="125" rx="23" fill="#ffd21a"/>
    <g fill="#07110c"><path d="M269 231q31-33 62 0v8h-62z"/><path d="M274 245h52v45q0 10-10 10h-32q-10 0-10-10z"/><path d="M263 247h8v35h-8zm66 0h8v35h-8zM284 295h9v18h-9zm23 0h9v18h-9z"/><path d="M281 218l-9-14M319 218l9-14" fill="none" stroke="#07110c" stroke-width="6"/></g>
    <g fill="#fff" font-size="17"><text x="85" y="370">• Vários fabricantes</text><text x="85" y="406">• Smartphones, TVs e relógios</text><text x="85" y="442">• Baseado em Linux</text></g>
    <rect x="45" y="535" width="510" height="430" rx="19" fill="#101b14" stroke="#16c65b" stroke-width="4"/>
    <text x="300" y="585" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">iOS</text><text x="300" y="625" text-anchor="middle" fill="#16c65b" font-size="19" font-weight="800">INTEGRAÇÃO</text>
    <rect x="240" y="651" width="120" height="125" rx="23" fill="#ffd21a"/>
    <g fill="#07110c"><path d="M300 684c-8-10-21-12-31-5-12 8-17 25-11 42 7 20 19 36 31 36 7 0 10-5 18-5 8 0 10 5 18 5 12 0 24-17 29-31-17-7-20-29-5-39-9-11-25-13-37-5-5 3-8 4-12 2z"/><path d="M308 673c1-12 10-22 22-24 1 12-7 23-22 24z"/></g>
    <g fill="#fff" font-size="17"><text x="85" y="825">• Hardware e software Apple</text><text x="85" y="861">• Segurança e experiência</text><text x="85" y="897">• Ecossistema integrado</text></g>
    <rect x="100" y="990" width="400" height="35" rx="17" fill="#ffd21a"/><text x="300" y="1013" text-anchor="middle" fill="#07110c" font-size="13" font-weight="800">A ESCOLHA DEPENDE DO USUÁRIO</text>
  </g>
</svg>
