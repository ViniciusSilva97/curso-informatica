<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img">
  <title>Vários sistemas operacionais em um único dia</title>
  <desc>Uma pessoa usa Windows no notebook, Android no celular, Linux no caixa eletrônico e nos servidores, e Android em uma Smart TV.</desc>
  <rect width="1200" height="590" rx="28" fill="#07110c"/>
  <text x="600" y="65" text-anchor="middle" fill="#ffd21a" font-family="Arial,sans-serif" font-size="30" font-weight="800">QUANTOS SISTEMAS VOCÊ USA EM UM DIA?</text>
  <g font-family="Arial,sans-serif">
    <path d="M120 270h960" stroke="#16c65b" stroke-width="8"/>
    <g fill="#ffd21a"><circle cx="140" cy="270" r="30"/><circle cx="370" cy="270" r="30"/><circle cx="600" cy="270" r="30"/><circle cx="830" cy="270" r="30"/><circle cx="1060" cy="270" r="30"/></g>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4"><rect x="55" y="110" width="170" height="105" rx="13"/><rect x="285" y="325" width="170" height="105" rx="13"/><rect x="515" y="110" width="170" height="105" rx="13"/><rect x="745" y="325" width="170" height="105" rx="13"/><rect x="975" y="110" width="170" height="105" rx="13"/></g>
    <g text-anchor="middle"><text x="140" y="150" fill="#ffd21a" font-size="20" font-weight="800">NOTEBOOK</text><text x="140" y="184" fill="#fff" font-size="18">Windows</text>
      <text x="370" y="365" fill="#ffd21a" font-size="20" font-weight="800">CELULAR</text><text x="370" y="399" fill="#fff" font-size="18">Android</text>
      <text x="600" y="150" fill="#ffd21a" font-size="20" font-weight="800">CAIXA</text><text x="600" y="184" fill="#fff" font-size="18">Linux</text>
      <text x="830" y="365" fill="#ffd21a" font-size="20" font-weight="800">SMART TV</text><text x="830" y="399" fill="#fff" font-size="18">Android</text>
      <text x="1060" y="150" fill="#ffd21a" font-size="20" font-weight="800">INTERNET</text><text x="1060" y="184" fill="#fff" font-size="18">servidores Linux</text></g>
    <g stroke="#ffd21a" stroke-width="5"><path d="M140 215v25"/><path d="M370 300v25"/><path d="M600 215v25"/><path d="M830 300v25"/><path d="M1060 215v25"/></g>
    <rect x="250" y="490" width="700" height="58" rx="29" fill="#16c65b"/><text x="600" y="526" text-anchor="middle" fill="#07110c" font-size="20" font-weight="800">DIFERENTES SISTEMAS, MUITAS TAREFAS CONECTADAS</text>
  </g>
</svg>
