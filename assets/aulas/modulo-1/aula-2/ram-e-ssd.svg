<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RAM e SSD: mesa de trabalho e estante</title>
  <desc id="desc">A RAM mantém temporariamente os programas em uso; o SSD guarda arquivos e programas mesmo com o computador desligado.</desc>
  <defs><style>.p{font-family:"Courier New",monospace;font-weight:700}.b{font-family:Arial,sans-serif}</style></defs>
  <rect width="1200" height="620" rx="22" fill="#fff8eb"/><rect x="18" y="18" width="1164" height="584" rx="14" fill="none" stroke="#050806" stroke-width="5"/>
  <text x="600" y="68" fill="#050806" font-size="32" text-anchor="middle" class="p">RAM E SSD NÃO SÃO A MESMA COISA</text>
  <rect x="65" y="115" width="500" height="405" rx="12" fill="#050806" stroke="#009c3b" stroke-width="5"/>
  <text x="315" y="170" fill="#19c65b" font-size="31" text-anchor="middle" class="p">RAM = MESA</text><text x="315" y="207" fill="#fff" font-size="19" text-anchor="middle" class="b">Rápida, temporária e usada agora</text>
  <path d="M145 390h340M185 390v80m260-80v80" stroke="#ffc900" stroke-width="18"/>
  <rect x="190" y="270" width="80" height="95" fill="#fff"/><rect x="290" y="245" width="95" height="120" fill="#ffc900"/><rect x="405" y="285" width="45" height="80" fill="#009c3b"/>
  <text x="315" y="493" fill="#bdc7c0" font-size="18" text-anchor="middle" class="b">Ao desligar, o conteúdo da mesa desaparece.</text>
  <rect x="635" y="115" width="500" height="405" rx="12" fill="#ffc900" stroke="#050806" stroke-width="5"/>
  <text x="885" y="170" fill="#050806" font-size="31" text-anchor="middle" class="p">SSD = ESTANTE</text><text x="885" y="207" fill="#050806" font-size="19" text-anchor="middle" class="b">Permanente, organizada e de maior capacidade</text>
  <path d="M735 250h300v210H735zM735 320h300M735 390h300" fill="#050806" stroke="#050806" stroke-width="8"/>
  <g fill="#19c65b"><rect x="755" y="270" width="95" height="28"/><rect x="875" y="270" width="135" height="28"/><rect x="755" y="340" width="130" height="28"/><rect x="910" y="340" width="100" height="28"/><rect x="755" y="410" width="110" height="28"/><rect x="890" y="410" width="120" height="28"/></g>
  <text x="885" y="493" fill="#050806" font-size="18" text-anchor="middle" class="b">Os arquivos continuam guardados após desligar.</text>
  <rect x="315" y="557" width="570" height="34" fill="#009c3b"/><text x="600" y="580" fill="#fff" font-size="17" text-anchor="middle" class="p">RAM TRABALHA · SSD ARMAZENA</text>
</svg>
