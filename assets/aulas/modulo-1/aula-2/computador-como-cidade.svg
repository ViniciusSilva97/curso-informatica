<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">O computador como uma cidade</title>
  <desc id="desc">CPU é o prefeito, RAM é a mesa de trabalho, SSD é o depósito e placa-mãe são as ruas que conectam tudo.</desc>
  <defs><style>.p{font-family:"Courier New",monospace;font-weight:700}.b{font-family:Arial,sans-serif}.c{fill:#101712;stroke:#19c65b;stroke-width:4}</style></defs>
  <rect width="1200" height="640" rx="22" fill="#050806"/>
  <text x="600" y="62" fill="#fff" font-size="32" text-anchor="middle" class="p">O COMPUTADOR COMO UMA CIDADE</text>
  <text x="600" y="98" fill="#bdc7c0" font-size="20" text-anchor="middle" class="b">Cada componente assume uma função e todos precisam trabalhar juntos.</text>
  <g fill="none" stroke="#ffc900" stroke-width="10"><path d="M300 245H465M735 245H900M300 475H465M735 475H900M600 330V390"/></g>
  <g class="c"><rect x="70" y="170" width="230" height="150" rx="10"/><rect x="900" y="170" width="230" height="150" rx="10"/><rect x="70" y="400" width="230" height="150" rx="10"/><rect x="900" y="400" width="230" height="150" rx="10"/></g>
  <rect x="465" y="165" width="270" height="390" rx="14" fill="#ffc900" stroke="#fff" stroke-width="5"/>
  <path d="M500 220h200v280H500zM500 300h200M570 220v280M630 220v280" fill="none" stroke="#009c3b" stroke-width="14"/>
  <rect x="540" y="265" width="120" height="120" fill="#050806" stroke="#fff" stroke-width="4"/>
  <text x="600" y="330" fill="#ffc900" font-size="23" text-anchor="middle" class="p">EQUIPE</text>
  <g fill="#ffc900" font-size="27" text-anchor="middle" class="p"><text x="185" y="213">CPU</text><text x="1015" y="213">RAM</text><text x="185" y="443">SSD</text><text x="1015" y="443">PLACA-MÃE</text></g>
  <g fill="#fff" font-size="19" text-anchor="middle" class="b">
    <text x="185" y="252">O prefeito</text><text x="185" y="282" fill="#bdc7c0">decide e executa</text>
    <text x="1015" y="252">A mesa</text><text x="1015" y="282" fill="#bdc7c0">mantém o trabalho atual</text>
    <text x="185" y="482">O depósito</text><text x="185" y="512" fill="#bdc7c0">guarda os dados</text>
    <text x="1015" y="482">As ruas</text><text x="1015" y="512" fill="#bdc7c0">conectam tudo</text>
  </g>
  <rect x="315" y="585" width="570" height="34" fill="#009c3b"/><text x="600" y="608" fill="#fff" font-size="17" text-anchor="middle" class="p">O DESEMPENHO DEPENDE DA EQUIPE</text>
</svg>
