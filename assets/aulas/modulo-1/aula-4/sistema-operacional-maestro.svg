<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img">
  <title>O sistema operacional como maestro do computador</title>
  <desc>O sistema operacional ocupa o centro e coordena programas, processador, memória, armazenamento e dispositivos.</desc>
  <rect width="1200" height="620" rx="28" fill="#07110c"/>
  <path d="M30 105V30h75M1095 30h75v75M30 515v75h75M1095 590h75v-75" fill="none" stroke="#16c65b" stroke-width="8"/>
  <text x="600" y="65" text-anchor="middle" fill="#ffd21a" font-family="Arial,sans-serif" font-size="30" font-weight="800">QUEM COORDENA O COMPUTADOR?</text>
  <g font-family="Arial,sans-serif">
    <rect x="448" y="174" width="304" height="238" rx="24" fill="#101b14" stroke="#ffd21a" stroke-width="7"/>
    <circle cx="600" cy="255" r="55" fill="#ffd21a"/>
    <path d="M570 255h60M600 225v60" stroke="#07110c" stroke-width="13"/>
    <text x="600" y="346" text-anchor="middle" fill="#fff" font-size="27" font-weight="800">SISTEMA</text>
    <text x="600" y="379" text-anchor="middle" fill="#16c65b" font-size="27" font-weight="800">OPERACIONAL</text>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="62" y="138" width="270" height="112" rx="15"/><rect x="868" y="138" width="270" height="112" rx="15"/>
      <rect x="62" y="360" width="270" height="112" rx="15"/><rect x="868" y="360" width="270" height="112" rx="15"/>
    </g>
    <g fill="#fff" text-anchor="middle"><text x="197" y="184" font-size="24" font-weight="800">PROGRAMAS</text><text x="197" y="220" font-size="17">Chrome • WhatsApp</text>
      <text x="1003" y="184" font-size="24" font-weight="800">CPU + RAM</text><text x="1003" y="220" font-size="17">processar e trabalhar</text>
      <text x="197" y="406" font-size="24" font-weight="800">ARQUIVOS</text><text x="197" y="442" font-size="17">SSD • pastas • fotos</text>
      <text x="1003" y="406" font-size="24" font-weight="800">DISPOSITIVOS</text><text x="1003" y="442" font-size="17">teclado • monitor</text></g>
    <g fill="none" stroke="#ffd21a" stroke-width="7"><path d="M332 194h98l28 32"/><path d="M868 194h-98l-28 32"/><path d="M332 416h98l28-32"/><path d="M868 416h-98l-28-32"/></g>
    <rect x="340" y="505" width="520" height="58" rx="29" fill="#16c65b"/>
    <text x="600" y="542" text-anchor="middle" fill="#07110c" font-size="20" font-weight="800">UM MAESTRO PARA TODAS AS PARTES</text>
  </g>
</svg>
