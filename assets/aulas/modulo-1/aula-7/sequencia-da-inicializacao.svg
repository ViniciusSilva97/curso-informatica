<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img">
  <title>Sequência de inicialização do computador</title>
  <desc>Ao pressionar o botão, a energia é distribuída, BIOS ou UEFI testa o hardware, encontra o dispositivo de inicialização, aciona o bootloader, carrega o sistema e exibe o login.</desc>
  <rect width="1200" height="650" rx="28" fill="#07110c"/>
  <path d="M30 105V30h75M1095 30h75v75M30 545v75h75M1095 620h75v-75" fill="none" stroke="#16c65b" stroke-width="8"/>
  <g font-family="Arial,sans-serif">
    <text x="600" y="66" text-anchor="middle" fill="#ffd21a" font-size="31" font-weight="800">DO BOTÃO À ÁREA DE TRABALHO</text>
    <path d="M115 275h970" fill="none" stroke="#ffd21a" stroke-width="8"/>
    <g fill="#101b14" stroke="#16c65b" stroke-width="4">
      <rect x="35" y="155" width="170" height="275" rx="18"/><rect x="225" y="155" width="170" height="275" rx="18"/><rect x="415" y="155" width="170" height="275" rx="18"/>
      <rect x="605" y="155" width="170" height="275" rx="18"/><rect x="795" y="155" width="170" height="275" rx="18"/><rect x="985" y="155" width="170" height="275" rx="18"/>
    </g>
    <g text-anchor="middle">
      <g fill="#ffd21a"><circle cx="120" cy="225" r="38"/><circle cx="310" cy="225" r="38"/><circle cx="500" cy="225" r="38"/><circle cx="690" cy="225" r="38"/><circle cx="880" cy="225" r="38"/><circle cx="1070" cy="225" r="38"/></g>
      <g fill="#07110c" font-size="25" font-weight="800"><text x="120" y="234">1</text><text x="310" y="234">2</text><text x="500" y="234">3</text><text x="690" y="234">4</text><text x="880" y="234">5</text><text x="1070" y="234">6</text></g>
      <g fill="#fff" font-size="19" font-weight="800"><text x="120" y="326">ENERGIA</text><text x="310" y="326">BIOS / UEFI</text><text x="500" y="326">DISPOSITIVO</text><text x="690" y="326">BOOTLOADER</text><text x="880" y="326">SISTEMA</text><text x="1070" y="326">LOGIN</text></g>
      <g fill="#16c65b" font-size="15"><text x="120" y="365">fonte alimenta</text><text x="310" y="365">testa o hardware</text><text x="500" y="365">SSD, HD ou USB</text><text x="690" y="365">inicia a carga</text><text x="880" y="365">drivers e serviços</text><text x="1070" y="365">perfil do usuário</text></g>
    </g>
    <rect x="225" y="485" width="750" height="92" rx="22" fill="#ffd21a"/>
    <text x="600" y="524" text-anchor="middle" fill="#07110c" font-size="24" font-weight="800">TUDO ISSO ACONTECE EM POUCOS SEGUNDOS</text>
    <text x="600" y="555" text-anchor="middle" fill="#07110c" font-size="17">O sistema operacional é uma das últimas etapas.</text>
  </g>
</svg>
